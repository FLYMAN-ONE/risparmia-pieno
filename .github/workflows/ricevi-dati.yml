# Riceve i file MIMIT consegnati dall'iPhone e li controlla.
# Il Comando Rapido carica uno zip nella release "dati-grezzi" e poi avvia questa azione.
# Nella fase 2 qui si aggiungeranno l'elaborazione e la pubblicazione del file prezzi.
name: Ricevi dati MIMIT

on:
  workflow_dispatch:

permissions:
  contents: write # serve solo per eliminare le consegne vecchie dalla release

# Se arrivano due consegne insieme, si elaborano una alla volta
concurrency:
  group: ricevi-dati
  cancel-in-progress: false

jobs:
  ricevi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Scarica l'ultima consegna
        run: |
          nome=$(gh release view dati-grezzi --json assets \
            --jq '[.assets[] | select(.name | test("^mimit-[0-9]{8}-[0-9]{4}\\.zip$"))] | sort_by(.createdAt) | last | .name')
          if [ -z "$nome" ] || [ "$nome" = "null" ]; then
            echo "::error::Nessuna consegna trovata nella release dati-grezzi"; exit 1
          fi
          echo "Consegna: $nome"
          mkdir -p consegna
          gh release download dati-grezzi --pattern "$nome" --dir consegna

      - name: Estrae e controlla i file
        working-directory: consegna
        run: |
          zip=$(ls mimit-*.zip)
          # Lo zip deve contenere esattamente i due file attesi, di dimensione ragionevole
          unzip -Z1 "$zip" | sort > contenuto.txt
          printf 'anagrafica_impianti_attivi.csv\nprezzo_alle_8.csv\n' > atteso.txt
          if ! diff -q contenuto.txt atteso.txt > /dev/null; then
            echo "::error::Lo zip non contiene i file attesi:"; cat contenuto.txt; exit 1
          fi
          totale=$(unzip -l "$zip" | tail -1 | awk '{print $1}')
          if [ "$totale" -gt 100000000 ]; then
            echo "::error::File troppo grandi ($totale byte)"; exit 1
          fi
          unzip -q -j "$zip" anagrafica_impianti_attivi.csv prezzo_alle_8.csv -d .
          for f in anagrafica_impianti_attivi.csv prezzo_alle_8.csv; do
            prima=$(head -1 "$f")
            echo "$f: $(wc -l < "$f") righe, $(wc -c < "$f") byte, riga 1: $prima"
            if ! echo "$prima" | grep -Eq '^Estrazione del [0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
              echo "::error::$f: la prima riga non è la data di estrazione"; exit 1
            fi
          done
          head -2 anagrafica_impianti_attivi.csv | tail -1 | grep -q '^idImpianto|Gestore|Bandiera|Tipo Impianto|Nome Impianto|Indirizzo|Comune|Provincia|Latitudine|Longitudine' \
            || { echo "::error::Intestazione dell'anagrafica cambiata"; exit 1; }
          head -2 prezzo_alle_8.csv | tail -1 | grep -q '^idImpianto|descCarburante|prezzo|isSelf|dtComu' \
            || { echo "::error::Intestazione dei prezzi cambiata"; exit 1; }
          echo "Controlli superati."

      - name: Tiene solo le ultime 10 consegne
        run: |
          gh release view dati-grezzi --json assets \
            --jq '[.assets[] | select(.name | startswith("mimit-"))] | sort_by(.createdAt) | reverse | .[10:] | .[].name' \
          | while read -r vecchio; do
              echo "Elimino $vecchio"; gh release delete-asset dati-grezzi "$vecchio" --yes
            done
