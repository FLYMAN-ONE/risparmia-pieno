# Riceve i file MIMIT consegnati dall'iPhone, li elabora e, se sono nuovi e sani, li pubblica.
# Il Comando Rapido carica uno zip nella release "dati-grezzi" e poi avvia questa azione.
# Se i controlli di qualità falliscono, non si pubblica nulla: resta il file del giorno prima
# e GitHub manda un'email per l'azione fallita.
name: Ricevi dati MIMIT

on:
  workflow_dispatch:

permissions:
  contents: write # per conservare il file buono e pulire le consegne vecchie

# Se arrivano due consegne insieme, si elaborano una alla volta
concurrency:
  group: ricevi-dati
  cancel-in-progress: false

jobs:
  elabora:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    outputs:
      nuovo: ${{ steps.confronto.outputs.nuovo }}
    steps:
      - name: Scarica il codice
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepara Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Scarica l'ultima consegna
        run: |
          nome=$(gh release view dati-grezzi --json assets \
            --jq '[.assets[] | select(.name | test("^mimit-[0-9]{8}-[0-9]{4}\\.zip$"))] | sort_by(.createdAt) | last | .name')
          if [ -z "$nome" ] || [ "$nome" = "null" ]; then
            echo "::error::Nessuna consegna trovata nella release dati-grezzi"; exit 1
          fi
          echo "Consegna: $nome"
          mkdir -p ../consegna
          gh release download dati-grezzi --pattern "$nome" --dir ../consegna

      - name: Estrae i file
        working-directory: ../consegna
        run: |
          zip=$(ls mimit-*.zip)
          # Lo zip deve contenere esattamente i due file attesi, di dimensione ragionevole
          unzip -Z1 "$zip" | sort > contenuto.txt
          printf 'anagrafica_impianti_attivi.csv\nprezzo_alle_8.csv\n' > atteso.txt
          if ! diff -q contenuto.txt atteso.txt > /dev/null; then
            echo "::error::Lo zip non contiene i file attesi:"; cat contenuto.txt; exit 1
          fi
          totale=$(unzip -l "$zip" | tail -1 | awk '{print $1}')
          if [ "$totale" -gt 100000000 ]; then
            echo "::error::File troppo grandi ($totale byte)"; exit 1
          fi
          unzip -q -j "$zip" anagrafica_impianti_attivi.csv prezzo_alle_8.csv -d .

      - name: Cucina (lettura, controlli di qualità, file prezzi)
        run: node cucina/src/cucina.ts ../consegna ../prezzi.json

      - name: Confronta con il file già pubblicato
        id: confronto
        run: |
          nuova=$(node -p 'require("../prezzi.json").dataEstrazione')
          if gh release download dati-pubblicati --pattern prezzi.json --output ../pubblicato.json; then
            vecchia=$(node -p 'require("../pubblicato.json").dataEstrazione')
          else
            vecchia="nessuna"
          fi
          echo "Dati consegnati: $nuova · già pubblicati: $vecchia"
          if [ "$vecchia" != "nessuna" ] && [[ ! "$nuova" > "$vecchia" ]]; then
            echo "Niente di nuovo: i dati del $nuova sono già pubblicati."
            echo "nuovo=false" >> "$GITHUB_OUTPUT"
          else
            echo "nuovo=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Conserva il nuovo file buono
        if: steps.confronto.outputs.nuovo == 'true'
        run: gh release upload dati-pubblicati ../prezzi.json --clobber

      - name: Tiene solo le ultime 10 consegne
        run: |
          gh release view dati-grezzi --json assets \
            --jq '[.assets[] | select(.name | startswith("mimit-"))] | sort_by(.createdAt) | reverse | .[10:] | .[].name' \
          | while read -r vecchio; do
              echo "Elimino $vecchio"; gh release delete-asset dati-grezzi "$vecchio" --yes
            done

  pubblica:
    needs: elabora
    if: needs.elabora.outputs.nuovo == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pubblica.yml
