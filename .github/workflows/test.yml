# Controlla il codice e esegue i test a ogni modifica caricata su GitHub.
# Se qualcosa non va, compare una X rossa e GitHub manda un'email.
name: Test

on:
  push:
    branches: [main]
  pull_request:

# Permessi minimi: l'azione può solo leggere il codice
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Scarica il codice
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepara Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - name: Installa gli strumenti
        run: npm ci

      - name: Controlla il codice (TypeScript)
        run: npm run check

      - name: Esegue i test
        run: npm test

      - name: Prova a costruire l'app
        run: npm run build
