# Verifica, da avviare a mano, che i file MIMIT si scarichino dai server di GitHub.
# Nella fase 2 diventerà l'aggiornamento automatico di ogni mattina.
name: Verifica download MIMIT

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifica:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Scarica il codice
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepara Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Diagnosi della connessione
        continue-on-error: true
        run: |
          getent ahosts www.mimit.gov.it || true
          curl -4 -sS -o /dev/null --connect-timeout 30 --max-time 120 -w "IPv4: HTTP %{http_code} %{size_download} byte %{time_total}s\n" https://www.mimit.gov.it/images/exportCSV/prezzo_alle_8.csv || echo "IPv4 fallito"
          curl -6 -sS -o /dev/null --connect-timeout 30 --max-time 120 -w "IPv6: HTTP %{http_code} %{size_download} byte %{time_total}s\n" https://www.mimit.gov.it/images/exportCSV/prezzo_alle_8.csv || echo "IPv6 fallito"
          curl -sS -o /dev/null --connect-timeout 30 -w "Sito di prova (dati.gov.it): HTTP %{http_code}\n" https://www.dati.gov.it/ || echo "anche dati.gov.it fallisce"

      - name: Scarica i file MIMIT
        run: node cucina/src/verifica-download.ts
