<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="" />
    <meta name="description" content="I distributori di carburante più economici intorno a te. Dati MIMIT, la posizione non lascia il telefono." />
    <title>Risparmia Pieno</title>
    <!-- App installabile (fase 7). L'icona arriverà più avanti: per ora il telefono usa la sua -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Risparmia Pieno" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <header class="barra-alta">
      <!-- Ricerca del comune: compare al tocco della lente, al posto dei filtri -->
      <form class="ricerca" data-ricerca role="search" hidden>
        <label class="campo-ricerca">
          <span data-icona="cerca"></span>
          <span class="solo-lettori">Cerca un comune</span>
          <input type="search" data-campo-ricerca placeholder="Cerca un comune" autocomplete="off" autocapitalize="words"
            autocorrect="off" spellcheck="false" enterkeyhint="search" />
        </label>
        <button type="button" class="annulla-ricerca" data-annulla-ricerca>Annulla</button>
      </form>
      <div class="filtri" data-filtri hidden></div>
      <p class="avviso-ritardo" data-avviso-ritardo role="status" hidden></p>
      <div class="raggio" data-raggio hidden></div>
    </header>

    <main class="contenuto" data-contenuto>
      <p class="invito">Tocca «Intorno a me» per vedere i distributori più convenienti vicino a te.</p>
    </main>

    <!-- La mappa: si scarica e si accende solo al tocco di "Mappa" -->
    <section class="vista-mappa" data-mappa aria-label="Mappa" hidden>
      <!-- Il distributore toccato sulla mappa: riquadro in basso, senza velo -->
      <div class="riquadro-mappa" data-riquadro role="region" aria-label="Distributore scelto" aria-live="polite" hidden></div>
    </section>

    <nav class="barra-bassa" aria-label="Comandi">
      <button type="button" class="bottone grande" data-intorno>
        <span data-icona="intornoAMe"></span>Intorno a me
      </button>
      <button type="button" class="bottone secondario grande cerca-comune" data-cerca aria-label="Cerca un comune">
        <span data-icona="cerca"></span>
      </button>
      <button type="button" class="bottone secondario grande cambia-vista" data-cambia-vista hidden></button>
    </nav>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
